        <section class="panel">${gridTable(["Name", "Theme", "Start Date", "End Date", "Team", "Planned Velocity", "Task Estimate", "State", ""],
          data[collection].map((record, index) => {
            const items = visibleItems().filter(item => item[releaseMode ? "release" : "iteration"] === record.name);
            return td([link(record.name, "edit-record", `${collection}:${index}`), e(record.theme || "Deliver clear, useful sample workflows"), e(record.start), e(record.end), e(data.currentProject), e(record.capacity ?? sum(items)), `${sum(items.flatMap(item => item.tasks), "estimate")} h`, badge(record.state), link("Edit", "edit-record", `${collection}:${index}`)]);

    if (page === "testfolders") {
      const selected = data.testFolders.find(folder => folder.id === ui.folder || folder.name === ui.folder);

  function sanitizeHTML(html) {
    const template=document.createElement("template");template.innerHTML=html;
    const tags=new Set(["STRONG","B","I","EM","U","UL","OL","LI","P","DIV","BR","H3","BLOCKQUOTE","CODE","TABLE","TBODY","TR","TH","TD"]);
    for(const element of [...template.content.querySelectorAll("*")].reverse()){
      if(!tags.has(element.tagName)){element.replaceWith(...element.childNodes);continue;}
      for(const attribute of [...element.attributes])element.removeAttribute(attribute.name);
    }
    return template.innerHTML;
  }

  function saveDetail() {

      const item=ui.detailDraft, previous=data.items.find(i=>i.id===item.id);

      data.items[data.items.findIndex(i=>i.id===item.id)]=clone(item);

        const related=data.items.find(i=>i.id===linkedId);if(related)related.feature=item.type==="feature"?item.id:item.feature;

        if(file.size>3*1024*1024){toast("Choose a sample attachment smaller than 3 MB.");continue;}
        const content=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});
        draft().attachments.push({name:file.name,size:Math.round(file.size/1024)+" KB",date:new Date().toISOString(),content});ui.detailDirty=true;
      }render();return;
    }
    if(control==="import"){
      try {const imported=JSON.parse(await el.files[0].text());if(imported.version!==1||!Array.isArray(imported.items)||!Array.isArray(imported.users)||!Array.isArray(imported.projects)||!imported.settings||!Array.isArray(imported.views))throw new Error("Choose an exported sample workspace.");
        for(const item of imported.items){if(typeof item.name!=="string"||typeof item.id!=="string"||!Array.isArray(item.tags)||!Array.isArray(item.tasks)||!Array.isArray(item.attachments))throw new Error("Invalid sample item.");for(const attachment of item.attachments)if(attachment.content&&!/^data:[^,]*;base64,/.test(attachment.content))delete attachment.content;}
        data=imported;ui.project=data.currentProject;save();closeOverlay();render();toast("Sample workspace imported.");
      }catch(error){toast(error.message);}return;
    }
    if(control==="view"){ui.view=el.value;applyView(data.views.find(v=>v.name===el.value));}
    else {ui[control]=el.type==="checkbox"?el.checked:el.value;if(control==="timebox"&&el.value==="All Iterations")ui.timebox="None";if(control==="pageSize")ui.pageSize=Number(el.value);if(["timebox","group","type"].includes(control)){markViewDirty();ui.pageNumber=1;}}
    render();
  });
  let dragging;
  document.addEventListener("dragstart",event=>{
    const cardEl=event.target.closest("[data-item]");if(!cardEl)return;
    dragging=cardEl.dataset.item;event.dataTransfer.setData("text/plain",dragging);event.dataTransfer.effectAllowed="move";cardEl.classList.add("dragging");
  });
  document.addEventListener("dragover",event=>{const col=event.target.closest("[data-state]");if(col&&dragging){event.preventDefault();col.classList.add("drop-target");}});
  document.addEventListener("dragleave",event=>event.target.closest("[data-state]")?.classList.remove("drop-target"));
  document.addEventListener("drop",event=>{
    const col=event.target.closest("[data-state]");if(!col||!dragging)return;event.preventDefault();
    const item=data.items.find(i=>i.id===dragging);item.state=col.dataset.state;
    if(col.dataset.group&&ui.group!=="None")item[ui.group.toLowerCase()]=col.dataset.group;
    const target=event.target.closest("[data-item]");
    if(target&&target.dataset.item!==dragging){data.items.splice(data.items.indexOf(item),1);data.items.splice(data.items.findIndex(i=>i.id===target.dataset.item),0,item);}
    dragging=null;save();render();toast("Sample work item moved.");
  });
  document.addEventListener("dragend",()=>{dragging=null;for(const el of document.querySelectorAll(".dragging,.drop-target"))el.classList.remove("dragging","drop-target");});
  document.addEventListener("keydown",event=>{
    if(event.key==="Escape"){closeOverlay();return;}
    if(overlay.querySelector(".modal")&&event.key==="Tab"){
      const focusable=Array.from(overlay.querySelectorAll('button,input,select,textarea,a,[tabindex="0"]')).filter(e=>!e.disabled&&!e.hidden);
      if(event.shiftKey&&document.activeElement===focusable[0]){event.preventDefault();focusable.at(-1)?.focus();}
      else if(!event.shiftKey&&document.activeElement===focusable.at(-1)){event.preventDefault();focusable[0]?.focus();}return;
    }
    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="s"&&ui.detailId){event.preventDefault();saveDetail();}
    if(event.altKey&&event.key.toLowerCase()==="b"){event.preventDefault();go("teamboard");}
    if(event.key==="/"&&!event.target.matches("input,textarea,[contenteditable=true]")){event.preventDefault();app.querySelector('[data-control=globalSearch]')?.focus();}
    if(event.key==="Enter"&&event.target.matches("[data-item]"))openItem(event.target.dataset.item);
  });
  window.addEventListener("hashchange",()=>{
    if(ui.detailDirty&&location.hash!==ui.currentHash){
      history.replaceState(null,"",location.pathname+location.search+ui.currentHash);
      canLeaveDetail();return;
    }
    parseRoute();render();
  });
  window.addEventListener("beforeunload",event=>{if(ui.detailDirty){event.preventDefault();event.returnValue="";}});
  // Exposed for deterministic offline verification and screen inventory.
  globalThis.RALLY_MOCKUP={navigation,extraPages,ui,get data(){return data;},render,go,openItem,filteredItems,saveDetail};
  parseRoute();ui.viewSnapshot=snapshotView();render();
})();
</script>
