[package]
name = "fastrock-workspaces"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[features]
http-fixtures = []

[[test]]
name = "store_startup"
harness = false

[[test]]
name = "vwork"
required-features = ["http-fixtures"]

[[test]]
name = "live_vwork"
required-features = ["http-fixtures"]

[dependencies]
anyhow.workspace = true
vwork-engine = { package = "vwork", git = "https://github.com/allquixotic/vwork", rev = "e1793df58bef6fbeacaf0b311f3f7858d54be7a5" }
fjall = "=3.1.13"
tempfile.workspace = true
rayon = "1.11"
base64.workspace = true
sha2 = "0.10"
git2 = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
redb = "4.4"
zstd = "0.13"
