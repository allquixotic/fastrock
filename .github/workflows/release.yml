name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    strategy:
      matrix:
        include:
          - { runner: windows-latest, arch: amd64 }
          - { runner: macos-latest, arch: arm64 }
          - { runner: macos-15-intel, arch: amd64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
      - run: go vet -tags=fltk_headless ./...
      - run: go test -tags=fltk_headless ./...
  windows:
    needs: check
    runs-on: windows-latest
    environment: azure-artifact-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
      - id: msys2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Select UCRT64 compilers
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $bin = Join-Path $env:MSYS2_ROOT 'ucrt64\bin'
          $bin >> $env:GITHUB_PATH
          "CC=$bin\gcc.exe" >> $env:GITHUB_ENV
          "CXX=$bin\g++.exe" >> $env:GITHUB_ENV
      - run: go run dev/package.go -os windows -arch amd64 -version '${{ github.ref_name }}' -phase build
      - name: Azure login for Artifact Signing (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_ARTIFACT_SIGNING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_ARTIFACT_SIGNING_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_ARTIFACT_SIGNING_SUBSCRIPTION_ID }}
      - name: Sign Windows executable
        uses: azure/trusted-signing-action@1d365fec12862c4aa68fcac418143d73f0cea293 # v0.5.11, matching Codex
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}/build/release/windows-amd64/fastrock.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          cache-dependencies: false
      - name: Verify and package signed executable
        env:
          FASTROCK_WINDOWS_PUBLISHER: ${{ vars.FASTROCK_WINDOWS_PUBLISHER }}
        run: go run dev/package.go -os windows -arch amd64 -version '${{ github.ref_name }}' -phase package
      - name: Verify packaged Windows updater compatibility
        env:
          FASTROCK_WINDOWS_PACKAGE_ARCHIVE: ${{ github.workspace }}/dist/fastrock-windows-amd64.zip
          FASTROCK_PACKAGE_VERSION: ${{ github.ref_name }}
          FASTROCK_PACKAGE_TRUSTED_EXECUTABLE: ${{ github.workspace }}/build/release/windows-amd64/fastrock.exe
        run: go test ./internal/update -run TestV78PackagedWindows -count=1
      - name: Attest signed Windows distribution and executable
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.zip
            build/release/windows-amd64/fastrock.exe
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-windows-amd64
          path: dist/*
          if-no-files-found: error
  macos:
    needs: check
    # Provisioned with Sean's pinned Developer ID identity and AC_NOTARY.
    # No certificate export or plaintext key is needed by this job.
    runs-on: [self-hosted, macOS, fastrock-signing]
    environment: codesigning
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      max-parallel: 1
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
      - name: Build, sign, notarize and package
        run: go run dev/package.go -os darwin -arch '${{ matrix.arch }}' -version '${{ github.ref_name }}' -dmg=true
      - name: Verify extracted distribution without launching the GUI
        env:
          FASTROCK_PACKAGE_ARCHIVE: ${{ github.workspace }}/dist/fastrock-darwin-${{ matrix.arch }}.zip
          FASTROCK_PACKAGE_VERSION: ${{ github.ref_name }}
        run: go test ./internal/update -run TestV15PackagedMacBundle -count=1
      - name: Attest signed macOS distributions and executable
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg
            build/release/darwin-${{ matrix.arch }}/Fastrock.app/Contents/MacOS/fastrock
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-darwin-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: notarization-${{ matrix.arch }}
          path: build/release/signing-${{ matrix.arch }}/*.json
  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: cat dist/*.sha256 > dist/SHA256SUMS
      - name: Attest release checksums
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/SHA256SUMS
      - name: Verify provenance of every release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          for asset in dist/*.zip dist/*.dmg dist/SHA256SUMS; do
            gh attestation verify "$asset" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref "$RELEASE_REF" --source-digest "$RELEASE_COMMIT"
          done
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create '${{ github.ref_name }}' dist/*.zip dist/*.dmg dist/SHA256SUMS --verify-tag --generate-notes
