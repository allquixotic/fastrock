name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - run: go vet -tags=nucular_headless ./...
      - run: go test -tags=nucular_headless ./...
      - run: go test -tags=nucular_headless ./...
        working-directory: third_party/nucular
      - if: runner.os == 'Windows'
        run: go build -trimpath -ldflags="-H=windowsgui -s -w" -o fastrock.exe ./cmd/fastrock
      - if: runner.os == 'macOS'
        run: go build -trimpath -o fastrock ./cmd/fastrock
      - uses: actions/upload-artifact@v4
        with:
          name: fastrock-${{ matrix.os }}
          path: |
            fastrock.exe
            fastrock
